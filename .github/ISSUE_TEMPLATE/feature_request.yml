name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you want solved
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example use case
      description: A short example of how you would use this feature.
      placeholder: I want to search ... so I can ...
  - type: textarea
    id: proposal
    attributes:
      label: The change you suggest
      description: Describe the behaviour you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
