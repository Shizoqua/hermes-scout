name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install "ruff==0.15.10"
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Install mypy
        run: python -m pip install "mypy==1.18.2"
      - name: Type check
        run: mypy

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - {os: macos-latest, python-version: "3.11"}
          - {os: macos-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.11"}
          - {os: windows-latest, python-version: "3.14"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install "pytest>=8,<9" "pytest-cov>=6,<8"
      - name: Run tests with coverage
        run: python -m pytest tests -q --cov=hermes_scout --cov-report=term-missing --cov-fail-under=90
