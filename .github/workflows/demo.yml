name: demo

# Records the README demo: real hermes-scout commands on the synthetic benchmark project, with
# nomic-embed-text in a pinned Ollama container. The asciicast is printed to the log between
# markers (and uploaded), and scripts/render_demo.py turns it into docs/demo.gif and docs/demo.mp4.
on:
  pull_request:
    paths: ["scripts/record_demo.py", ".github/workflows/demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      ollama:
        image: ollama/ollama@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761  # 0.40.15
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Pull the embedding model
        run: |
          for _ in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          curl -sf http://localhost:11434/api/pull -d '{"model": "nomic-embed-text", "stream": false}'
          curl -sf http://localhost:11434/v1/embeddings -d '{"model": "nomic-embed-text", "input": ["warm up"]}' > /dev/null
      - name: Record the session
        run: |
          python scripts/record_demo.py --base-url http://localhost:11434/v1 --model nomic-embed-text > demo.cast
          echo "=== CAST BEGIN ==="
          cat demo.cast
          echo "=== CAST END ==="
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: demo-cast
          path: demo.cast
