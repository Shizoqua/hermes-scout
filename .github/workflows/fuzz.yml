name: fuzz

# Fuzzes the readers that take untrusted bytes (PDF, Office and OpenDocument XML, keyword queries) with Atheris
# for a few minutes, on changes to them and once a week. A crash fails the run and uploads the input.
on:
  pull_request:
    paths: ["hermes_scout/documents.py", "hermes_scout/engine.py", "fuzz/**", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Atheris
        run: python -m pip install --require-hashes -r .github/requirements/fuzz.txt
      - name: Fuzz for three minutes
        run: |
          mkdir -p crashes work
          cp fuzz/corpus/* work/
          python fuzz/fuzz_documents.py -max_total_time=180 -timeout=10 -rss_limit_mb=2048 -artifact_prefix=crashes/ work
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: crashes/
