<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="0.55" stop-color="#141236"/>
      <stop offset="1" stop-color="#1f1147"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9b8ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>
  <rect width="1200" height="600" fill="url(#glow)"/>

  <!-- left: name and pitch -->
  <rect x="72" y="118" width="214" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.5"/>
  <text x="179" y="142" text-anchor="middle" font-family="Inter" font-size="16" font-weight="600" fill="#d8ccff">Hermes Agent plugin</text>

  <text x="70" y="236" font-family="Inter" font-size="74" font-weight="800" fill="url(#title)" letter-spacing="-2">hermes</text>
  <text x="70" y="314" font-family="Inter" font-size="74" font-weight="800" fill="url(#title)" letter-spacing="-2">scout</text>

  <text x="72" y="368" font-family="Inter" font-size="23" fill="#b9b6d6">Find anything in your files by meaning,</text>
  <text x="72" y="400" font-family="Inter" font-size="23" fill="#b9b6d6">not just by keywords.</text>

  <g font-family="Inter" font-size="15" font-weight="600" fill="#e7e3ff">
    <rect x="72" y="440" width="138" height="34" rx="17" fill="#ffffff" fill-opacity="0.07"/>
    <text x="141" y="462" text-anchor="middle">Local-first</text>
    <rect x="220" y="440" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.07"/>
    <text x="304" y="462" text-anchor="middle">Incremental index</text>
    <rect x="398" y="440" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.07"/>
    <text x="482" y="462" text-anchor="middle">Zero dependencies</text>
  </g>

  <!-- right: a search card -->
  <g>
    <rect x="628" y="96" width="512" height="410" rx="22" fill="#0f1530" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="660" cy="124" r="6" fill="#ff5f57"/>
    <circle cx="680" cy="124" r="6" fill="#febc2e"/>
    <circle cx="700" cy="124" r="6" fill="#28c840"/>

    <rect x="656" y="148" width="456" height="54" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#7c5cff" stroke-opacity="0.7"/>
    <circle cx="684" cy="173" r="9" fill="none" stroke="#c4b5fd" stroke-width="3"/>
    <line x1="691" y1="180" x2="698" y2="187" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    <text x="712" y="182" font-family="Inter" font-size="19" fill="#ffffff">where do we handle rate limits?</text>

    <g font-family="DejaVu Sans Mono" font-size="16">
      <text x="660" y="246" fill="#e9e6ff">notes/retries.md</text>
      <text x="1108" y="246" text-anchor="end" fill="#7dd3fc">0.82</text>
      <text x="660" y="268" font-size="13" fill="#8f8bb3">lines 12-30</text>
      <rect x="660" y="280" width="448" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="660" y="280" width="367" height="6" rx="3" fill="url(#bar)"/>

      <text x="660" y="330" fill="#e9e6ff">src/client/backoff.py</text>
      <text x="1108" y="330" text-anchor="end" fill="#7dd3fc">0.77</text>
      <text x="660" y="352" font-size="13" fill="#8f8bb3">lines 40-71</text>
      <rect x="660" y="364" width="448" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="660" y="364" width="345" height="6" rx="3" fill="url(#bar)"/>

      <text x="660" y="414" fill="#e9e6ff">docs/api-errors.md</text>
      <text x="1108" y="414" text-anchor="end" fill="#7dd3fc">0.64</text>
      <text x="660" y="436" font-size="13" fill="#8f8bb3">lines 5-19</text>
      <rect x="660" y="448" width="448" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="660" y="448" width="287" height="6" rx="3" fill="url(#bar)"/>
    </g>
    <text x="660" y="486" font-family="Inter" font-size="13" fill="#8f8bb3">ranked by cosine similarity · 3 of 1,284 chunks</text>
  </g>

  <text x="72" y="548" font-family="Inter" font-size="15" fill="#7f7aa6">Ollama · LM Studio · llama.cpp · vLLM · any OpenAI-compatible /embeddings endpoint</text>
</svg>
