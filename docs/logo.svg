<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="hermes-scout logo">
  <defs>
    <linearGradient id="tile" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <!-- lens -->
  <circle cx="56" cy="56" r="30" fill="#3b0764" fill-opacity="0.3" stroke="#ffffff" stroke-width="9"/>
  <!-- handle -->
  <line x1="78" y1="78" x2="102" y2="102" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- embedding points: close ones bright, a far one faint -->
  <circle cx="47" cy="50" r="5.5" fill="#ffffff"/>
  <circle cx="61" cy="45" r="5.5" fill="#ffffff"/>
  <circle cx="57" cy="61" r="5.5" fill="#ffffff"/>
  <circle cx="70" cy="66" r="3.5" fill="#ffffff" fill-opacity="0.45"/>
  <path d="M47 50 L61 45 L57 61 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" stroke-opacity="0.8"/>
</svg>
