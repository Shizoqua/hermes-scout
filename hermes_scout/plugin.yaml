name: hermes-scout
version: 0.5.0
description: Search local files by meaning with embeddings from any OpenAI-compatible server (Ollama by default)
author: Lanre Shittu
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/Shizoqua/hermes-scout
tags: [search, embeddings, retrieval, rag, local]
requires_hermes: ">=0.21.0"
provides_tools:
  - scout_search
  - scout_similar
config_schema:
  base_url:
    type: str
    default: "http://localhost:11434/v1"
    label: Embeddings endpoint
    description: "OpenAI-compatible base URL; the plugin calls <base_url>/embeddings. Ollama: http://localhost:11434/v1"
  embedding_model:
    type: str
    default: nomic-embed-text
    label: Embedding model
    description: "Model name the endpoint serves (for Ollama: run `ollama pull nomic-embed-text` once)"
  api_key:
    type: secret
    env: SCOUT_API_KEY
    label: API key
    description: "Only for hosted endpoints; leave empty for a local server"
  top_k:
    type: int
    default: 5
    label: Results per search
  chunk_chars:
    type: int
    default: 1200
    label: Chunk size (characters)
    description: "Changing it applies to files indexed afterwards"
  max_files:
    type: int
    default: 2000
    label: Max files per folder
  max_file_kb:
    type: int
    default: 1000
    label: Max file size (KB)
  respect_gitignore:
    type: bool
    default: true
    label: Respect .gitignore
    description: "Skip files and folders that .gitignore files in the searched folder ignore"
  read_documents:
    type: bool
    default: true
    label: Read documents
    description: "Also index the text of PDF, Word, Excel, PowerPoint and OpenDocument files up to 20 MB, extracted on this machine"
  ranking:
    type: str
    default: hybrid
    label: Ranking
    description: "hybrid (default): meaning for questions, exact words first for code names like ERR_4291. semantic: meaning only. keyword: exact words only"
